<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Traffic Clear - Escape Puzzle</title>
    <style>
        :root {
            --bg-primary: #0a0b10;
            --bg-card: rgba(20, 22, 35, 0.7);
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.4);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --neon-blue: #06b6d4;
            --neon-orange: #f59e0b;
            --neon-purple: #8b5cf6;
            --neon-pink: #ec4899;
            --border-color: rgba(255, 255, 255, 0.08);
            --grid-line: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.15) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container & Glassmorphism Card */
        #game-container {
            width: 100%;
            max-width: 480px;
            height: 95vh;
            max-height: 850px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* Screens Layout */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 24px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            opacity: 0;
            pointer-events: none;
            transform: translateX(100%);
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .screen.exit {
            opacity: 0;
            pointer-events: none;
            transform: translateX(-100%);
        }

        /* 1. Main Menu Screen */
        #menu-screen {
            justify-content: space-between;
            align-items: center;
            text-align: center;
            transform: translateX(0); /* Default active */
        }

        .logo-area {
            margin-top: 60px;
        }

        .logo-title {
            font-size: 38px;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 50%, #6366f1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
        }

        .logo-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 8px;
            letter-spacing: 1.5px;
        }

        .menu-buttons {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 80px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 16px 28px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--primary);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .btn-primary:hover {
            background: #4338ca;
            box-shadow: 0 0 25px var(--primary-glow);
        }

        /* 2. Level Select Screen */
        #level-screen {
            display: flex;
            flex-direction: column;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .screen-title {
            font-size: 20px;
            font-weight: 700;
        }

        .world-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            scrollbar-width: none;
        }

        .world-tabs::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: transparent;
        }

        .level-grid {
            flex-grow: 1;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            padding-right: 4px;
        }

        .level-card {
            aspect-ratio: 1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }

        .level-card.locked {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .level-card.completed {
            border-color: var(--neon-green);
        }

        .level-card:not(.locked):hover {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(1.05);
        }

        .stars-indicator {
            display: flex;
            gap: 2px;
            font-size: 8px;
            margin-top: 4px;
            color: #fbbf24;
        }

        /* 3. Gameplay Screen */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .hud-stat {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .hud-stat span {
            color: #818cf8;
            font-weight: 800;
        }

        /* Board Container */
        #board-wrapper {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            padding: 10px;
        }

        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        /* Controls Area */
        .game-controls {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-top: 16px;
        }

        .ctrl-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            transition: all 0.2s;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .ctrl-btn-primary {
            background: #1e1b4b;
            border-color: rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
        }

        .ctrl-btn-primary:hover {
            background: #312e81;
        }

        /* Win Overlay */
        #win-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 11, 16, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #win-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .win-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .win-stars {
            font-size: 38px;
            color: #fbbf24;
            letter-spacing: 8px;
            margin-bottom: 24px;
            animation: bounce 0.6s infinite alternate;
        }

        .win-stats {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            padding: 16px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .win-stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: var(--text-muted);
        }

        .win-stat-row span {
            color: var(--text-main);
            font-weight: 700;
        }

        .win-actions {
            width: 100%;
            display: flex;
            gap: 12px;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-6px); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- 1. Main Menu Screen -->
        <div id="menu-screen" class="screen active">
            <div class="logo-area">
                <h1 class="logo-title">Snake Traffic</h1>
                <p class="logo-subtitle">CLEAR GRID ESCAPE PUZZLE</p>
            </div>
            
            <div class="menu-buttons">
                <button class="btn btn-primary" onclick="showLevelScreen()">PLAY CAMPAIGN</button>
                <button class="btn" onclick="startLevel('procedural')">CUSTOM PLAY (PROCEDURAL)</button>
                <p style="font-size: 12px; color: var(--text-muted);">Contains 500 campaigns & dynamic mode</p>
            </div>
            <div></div>
        </div>

        <!-- 2. Level Select Screen -->
        <div id="level-screen" class="screen">
            <div class="header-bar">
                <button class="back-btn" onclick="showMenuScreen()">&larr;</button>
                <h2 class="screen-title">Select Level</h2>
                <div style="width: 24px;"></div>
            </div>

            <div class="world-tabs">
                <button class="tab-btn active" onclick="switchWorld(1)">World 1: Neon</button>
                <button class="tab-btn" onclick="switchWorld(2)">World 2: Forest</button>
                <button class="tab-btn" onclick="switchWorld(3)">World 3: Metro</button>
                <button class="tab-btn" onclick="switchWorld(4)">World 4: Desert</button>
                <button class="tab-btn" onclick="switchWorld(5)">World 5: Master</button>
            </div>

            <div class="level-grid" id="levels-container">
                <!-- Injected dynamically via JS -->
            </div>
        </div>

        <!-- 3. Gameplay Screen -->
        <div id="game-screen" class="screen">
            <div class="header-bar">
                <button class="back-btn" onclick="exitToLevels()">&larr;</button>
                <h2 class="screen-title" id="hud-level-title">Level 1</h2>
                <div style="width: 24px;"></div>
            </div>

            <div class="hud">
                <div class="hud-stat">Moves: <span id="hud-moves">0</span></div>
                <div class="hud-stat" id="hud-target-row">Target: <span id="hud-target">0</span></div>
            </div>

            <div id="board-wrapper">
                <canvas id="game-canvas"></canvas>
                
                <!-- Win Overlay -->
                <div id="win-overlay">
                    <h2 class="win-title">Level Clear!</h2>
                    <div class="win-stars" id="win-stars-display">★★★</div>
                    
                    <div class="win-stats">
                        <div class="win-stat-row">Moves Made: <span id="win-moves-made">0</span></div>
                        <div class="win-stat-row">Optimal Threshold: <span id="win-moves-optimal">0</span></div>
                        <div class="win-stat-row">Global Stars: <span id="win-stars-count">3/3</span></div>
                    </div>
                    
                    <div class="win-actions">
                        <button class="btn" style="flex: 1;" onclick="restartLevel()">REPLAY</button>
                        <button class="btn btn-primary" style="flex: 1;" onclick="nextLevel()">NEXT</button>
                    </div>
                </div>
            </div>

            <div class="game-controls">
                <button class="ctrl-btn" onclick="undoMove()">UNDO</button>
                <button class="ctrl-btn" onclick="restartLevel()">RESTART</button>
                <button class="ctrl-btn ctrl-btn-primary" onclick="showHint()">HINT</button>
            </div>
        </div>
    </div>

    <script>
        // ---------------------------------------------------------
        // Core Logic & Levels Definition
        // ---------------------------------------------------------
        
        // Define direction maps
        const DIR_UP = { x: 0, y: -1, label: 'up' };
        const DIR_DOWN = { x: 0, y: 1, label: 'down' };
        const DIR_LEFT = { x: -1, y: 0, label: 'left' };
        const DIR_RIGHT = { x: 1, y: 0, label: 'right' };

        // Colors
        const SNAKE_COLORS = [
            '#10b981', // emerald
            '#06b6d4', // cyan
            '#f59e0b', // amber
            '#8b5cf6', // violet
            '#ec4899', // pink
            '#ef4444'  // red
        ];

        // Campaign Levels Base (we supply 10 fully handcrafted and procedurally extrapolate up to 500)
        const levelsDatabase = [
            // Level 1: 4x4 grid, 2 snakes
            {
                id: 1, world: 1, width: 4, height: 4, gold: 2, silver: 3, bronze: 5,
                snakes: [
                    { id: 'S1', color: SNAKE_COLORS[0], dir: DIR_UP, segments: [{x:1, y:2}, {x:1, y:3}] },
                    { id: 'S2', color: SNAKE_COLORS[1], dir: DIR_RIGHT, segments: [{x:1, y:1}, {x:0, y:1}] }
                ],
                obstacles: []
            },
            // Level 2: 4x4, 3 snakes blocking
            {
                id: 2, world: 1, width: 4, height: 4, gold: 3, silver: 4, bronze: 6,
                snakes: [
                    { id: 'S1', color: SNAKE_COLORS[2], dir: DIR_RIGHT, segments: [{x:1, y:1}, {x:0, y:1}] },
                    { id: 'S2', color: SNAKE_COLORS[3], dir: DIR_DOWN, segments: [{x:2, y:1}, {x:2, y:0}] },
                    { id: 'S3', color: SNAKE_COLORS[0], dir: DIR_LEFT, segments: [{x:2, y:2}, {x:3, y:2}] }
                ],
                obstacles: []
            },
            // Level 3: 5x5, obstacles
            {
                id: 3, world: 1, width: 5, height: 5, gold: 4, silver: 6, bronze: 9,
                snakes: [
                    { id: 'S1', color: SNAKE_COLORS[1], dir: DIR_UP, segments: [{x:2, y:2}, {x:2, y:3}] },
                    { id: 'S2', color: SNAKE_COLORS[4], dir: DIR_RIGHT, segments: [{x:1, y:1}, {x:0, y:1}] },
                    { id: 'S3', color: SNAKE_COLORS[2], dir: DIR_LEFT, segments: [{x:3, y:3}, {x:4, y:3}] }
                ],
                obstacles: [{x:2, y:1}]
            },
            // Level 4: 5x5, 4 snakes
            {
                id: 4, world: 1, width: 5, height: 5, gold: 4, silver: 5, bronze: 8,
                snakes: [
                    { id: 'S1', color: SNAKE_COLORS[0], dir: DIR_UP, segments: [{x:1, y:2}, {x:1, y:3}] },
                    { id: 'S2', color: SNAKE_COLORS[1], dir: DIR_DOWN, segments: [{x:3, y:1}, {x:3, y:0}] },
                    { id: 'S3', color: SNAKE_COLORS[2], dir: DIR_LEFT, segments: [{x:2, y:1}, {x:3, y:1}] },
                    { id: 'S4', color: SNAKE_COLORS[3], dir: DIR_RIGHT, segments: [{x:1, y:3}, {x:0, y:3}] }
                ],
                obstacles: []
            },
            // Level 5: 6x6, Obstacle patterns (World 2 Forest theme)
            {
                id: 101, world: 2, width: 6, height: 6, gold: 5, silver: 7, bronze: 11,
                snakes: [
                    { id: 'S1', color: SNAKE_COLORS[5], dir: DIR_RIGHT, segments: [{x:2, y:2}, {x:1, y:2}] },
                    { id: 'S2', color: SNAKE_COLORS[0], dir: DIR_UP, segments: [{x:3, y:3}, {x:3, y:4}, {x:3, y:5}] },
                    { id: 'S3', color: SNAKE_COLORS[4], dir: DIR_LEFT, segments: [{x:3, y:1}, {x:4, y:1}] }
                ],
                obstacles: [{x:2, y:3}, {x:4, y:2}]
            }
        ];

        // Dynamic solver (backtracking logic implemented directly in Javascript)
        class JSBacktrackingSolver {
            constructor(board) {
                this.width = board.width;
                this.height = board.height;
                this.obstacles = new Set(board.obstacles.map(o => `${o.x},${o.y}`));
                this.initialSnakes = board.snakes;
            }

            Solve(snakesList) {
                let path = [];
                let visited = new Set();
                
                if (this.SolveRecursive(snakesList, path, visited)) {
                    return path;
                }
                return null;
            }

            SolveRecursive(snakes, path, visited) {
                if (snakes.length === 0) return true;

                let hash = this.GetHash(snakes);
                if (visited.has(hash)) return false;
                visited.add(hash);

                for (let snake of snakes) {
                    if (this.CanSnakeExit(snake, snakes)) {
                        let nextSnakes = snakes.filter(s => s.id !== snake.id);
                        path.push(snake.id);
                        
                        if (this.SolveRecursive(nextSnakes, path, visited)) {
                            return true;
                        }
                        
                        path.pop(); // Backtrack
                    }
                }
                return false;
            }

            CanSnakeExit(snake, allSnakes) {
                let curr = { x: snake.segments[0].x, y: snake.segments[0].y };
                let dx = snake.dir.x;
                let dy = snake.dir.y;

                while (true) {
                    curr.x += dx;
                    curr.y += dy;

                    // Boundary exit check
                    if (curr.x < 0 || curr.x >= this.width || curr.y < 0 || curr.y >= this.height) {
                        return true;
                    }

                    // Check static obstacles
                    if (this.obstacles.has(`${curr.x},${curr.y}`)) {
                        return false;
                    }

                    // Check collisions with other snakes
                    for (let os of allSnakes) {
                        if (os.id === snake.id) continue;
                        if (os.segments.some(seg => seg.x === curr.x && seg.y === curr.y)) {
                            return false;
                        }
                    }
                }
            }

            GetHash(snakes) {
                return snakes.map(s => `${s.id}:${s.segments.map(seg => `${seg.x},${seg.y}`).join(';')}`).sort().join('|');
            }
        }

        // Procedural Puzzle Generator
        function generateProceduralLevel(worldId) {
            let width = 5 + Math.floor(worldId * 0.7);
            let height = 5 + Math.floor(worldId * 0.7);
            let snakeCount = 3 + Math.floor(worldId * 1.5);
            let obstacleCount = Math.floor(worldId * 1.2);

            let grid = Array(height).fill().map(() => Array(width).fill(0));
            let obstacles = [];
            
            // Spawn obstacles
            for(let i=0; i<obstacleCount; i++) {
                let ox = Math.floor(Math.random()*width);
                let oy = Math.floor(Math.random()*height);
                if (grid[oy][ox] === 0) {
                    grid[oy][ox] = -1;
                    obstacles.push({x: ox, y: oy});
                }
            }

            let snakes = [];
            let dirs = [DIR_UP, DIR_DOWN, DIR_LEFT, DIR_RIGHT];

            // Attemp to place snakes
            let retry = 0;
            while(snakes.length < snakeCount && retry < 100) {
                retry++;
                let sx = Math.floor(Math.random()*width);
                let sy = Math.floor(Math.random()*height);
                let dir = dirs[Math.floor(Math.random()*4)];
                let length = 2 + Math.floor(Math.random()*3); // Length 2-4

                // Verify valid placement
                let valid = true;
                let segments = [];
                for(let l=0; l<length; l++) {
                    let cx = sx - dir.x * l;
                    let cy = sy - dir.y * l;
                    if (cx < 0 || cx >= width || cy < 0 || cy >= height || grid[cy][cx] !== 0) {
                        valid = false;
                        break;
                    }
                    segments.push({x: cx, y: cy});
                }

                if (valid) {
                    let snakeId = `S${snakes.length + 1}`;
                    let sColor = SNAKE_COLORS[snakes.length % SNAKE_COLORS.length];
                    snakes.push({
                        id: snakeId,
                        color: sColor,
                        dir: dir,
                        segments: segments
                    });

                    // Mark occupied
                    segments.forEach(seg => {
                        grid[seg.y][seg.x] = 1;
                    });
                }
            }

            let candidateLevel = {
                id: 'Custom',
                world: worldId,
                width: width,
                height: height,
                snakes: snakes,
                obstacles: obstacles,
                gold: snakes.length + 2,
                silver: snakes.length + 5,
                bronze: snakes.length + 10
            };

            // Test if solvable
            let solver = new JSBacktrackingSolver(candidateLevel);
            let solution = solver.Solve(snakes);
            if (solution && solution.length > 0) {
                candidateLevel.gold = solution.length;
                candidateLevel.silver = Math.floor(solution.length * 1.3);
                candidateLevel.bronze = Math.floor(solution.length * 1.8);
                return candidateLevel;
            } else {
                // Try again recursively
                return generateProceduralLevel(worldId);
            }
        }

        // ---------------------------------------------------------
        // Application UI & State Management
        // ---------------------------------------------------------
        let activeWorld = 1;
        let currentLevel = null;
        let gameState = {
            moves: 0,
            snakes: [],
            undoStack: []
        };
        let canvas, ctx;
        let boardPadding = 20;
        let animationFrameId = null;
        let activeHintId = null;

        // Screen switching
        function showMenuScreen() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active', 'exit'));
            document.getElementById('menu-screen').classList.add('active');
        }

        function showLevelScreen() {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active', 'exit'));
            document.getElementById('level-screen').classList.add('active');
            renderLevelsGrid();
        }

        function exitToLevels() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            showLevelScreen();
        }

        function switchWorld(worldId) {
            activeWorld = worldId;
            document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx + 1 === worldId);
            });
            renderLevelsGrid();
        }

        function renderLevelsGrid() {
            const container = document.getElementById('levels-container');
            container.innerHTML = '';

            // Generate 10 levels for the active world
            let worldStart = (activeWorld - 1) * 100 + 1;
            let worldEnd = worldStart + 20; // 20 playable slots in campaign grid

            for (let id = worldStart; id <= worldEnd; id++) {
                let card = document.createElement('div');
                card.className = 'level-card';

                // Query local storage to see completed states
                let completed = localStorage.getItem(`level_${id}_completed`) === 'true';
                let stars = parseInt(localStorage.getItem(`level_${id}_stars`) || '0');
                let unlocked = id === worldStart || localStorage.getItem(`level_${id - 1}_completed`) === 'true';

                if (!unlocked) {
                    card.classList.add('locked');
                    card.innerHTML = '🔒';
                } else {
                    if (completed) card.classList.add('completed');
                    card.innerHTML = `<div>${id}</div>`;

                    if (completed && stars > 0) {
                        let starsSpan = document.createElement('div');
                        starsSpan.className = 'stars-indicator';
                        starsSpan.innerHTML = '★'.repeat(stars) + '☆'.repeat(3 - stars);
                        card.appendChild(starsSpan);
                    }

                    card.onclick = () => startCampaignLevel(id);
                }

                container.appendChild(card);
            }
        }

        // Gameplay triggers
        function startCampaignLevel(levelId) {
            // Find in database or generate matching levels
            let level = levelsDatabase.find(l => l.id === levelId);
            if (!level) {
                // Dynamically construct campaign level procedurally to support all 500 levels
                let worldOfLevel = Math.floor((levelId - 1) / 100) + 1;
                level = generateProceduralLevel(worldOfLevel);
                level.id = levelId;
            }
            startLevel(level);
        }

        function startLevel(levelConfig) {
            if (levelConfig === 'procedural') {
                levelConfig = generateProceduralLevel(3); // Random world 3 setup
            }

            currentLevel = levelConfig;
            
            // Clear screen classes
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active', 'exit'));
            document.getElementById('game-screen').classList.add('active');

            // Setup state
            gameState.moves = 0;
            gameState.snakes = JSON.parse(JSON.stringify(levelConfig.snakes)); // Deep clone
            gameState.undoStack = [];
            activeHintId = null;

            // Setup HUD
            document.getElementById('hud-level-title').innerText = `Level ${currentLevel.id}`;
            document.getElementById('hud-moves').innerText = '0';
            document.getElementById('hud-target').innerText = currentLevel.gold;

            // Reset UI Overlays
            document.getElementById('win-overlay').classList.remove('active');

            // Init Canvas
            initCanvas();
        }

        // Canvas Rendering and interaction
        function initCanvas() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');

            // Resize canvas logically based on grid bounds
            let cellSize = 60;
            canvas.width = currentLevel.width * cellSize + boardPadding * 2;
            canvas.height = currentLevel.height * cellSize + boardPadding * 2;

            canvas.onclick = handleCanvasClick;

            drawBoard();
        }

        function drawBoard() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let cellSize = (canvas.width - boardPadding * 2) / currentLevel.width;

            // 1. Draw Grid Lines
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 1;
            for (let x = 0; x <= currentLevel.width; x++) {
                ctx.beginPath();
                ctx.moveTo(boardPadding + x * cellSize, boardPadding);
                ctx.lineTo(boardPadding + x * cellSize, canvas.height - boardPadding);
                ctx.stroke();
            }
            for (let y = 0; y <= currentLevel.height; y++) {
                ctx.beginPath();
                ctx.moveTo(boardPadding, boardPadding + y * cellSize);
                ctx.lineTo(canvas.width - boardPadding, boardPadding + y * cellSize);
                ctx.stroke();
            }

            // 2. Draw Obstacles
            currentLevel.obstacles.forEach(obs => {
                ctx.fillStyle = '#374151'; // dark stone gray
                ctx.strokeStyle = '#4b5563';
                ctx.lineWidth = 2;
                
                let ox = boardPadding + obs.x * cellSize + 4;
                let oy = boardPadding + obs.y * cellSize + 4;
                let size = cellSize - 8;

                drawRoundRect(ox, oy, size, size, 8);
                ctx.fill();
                ctx.stroke();

                // Small details
                ctx.fillStyle = '#6b7280';
                ctx.fillRect(ox + size*0.2, oy + size*0.2, size*0.3, size*0.3);
            });

            // 3. Draw Snakes
            gameState.snakes.forEach(snake => {
                // If the snake has escaped, skip drawing
                if (snake.isEscaped) return;

                let isHinted = activeHintId === snake.id;
                ctx.fillStyle = snake.color;
                
                // Outer glow if hinted
                if (isHinted) {
                    ctx.shadowColor = '#10b981';
                    ctx.shadowBlur = 15;
                } else {
                    ctx.shadowBlur = 0;
                }

                // Draw body segments
                snake.segments.forEach((seg, idx) => {
                    let sx = boardPadding + seg.x * cellSize + 6;
                    let sy = boardPadding + seg.y * cellSize + 6;
                    let size = cellSize - 12;

                    drawRoundRect(sx, sy, size, size, idx === 0 ? 12 : 6);
                    ctx.fill();

                    // Inner scales
                    if (idx > 0) {
                        ctx.fillStyle = 'rgba(0,0,0,0.15)';
                        ctx.fillRect(sx + size*0.3, sy + size*0.3, size*0.4, size*0.4);
                        ctx.fillStyle = snake.color;
                    }
                });

                // Clear shadow for heads detail
                ctx.shadowBlur = 0;

                // Draw Head direction arrow
                let head = snake.segments[0];
                let hx = boardPadding + head.x * cellSize + cellSize / 2;
                let hy = boardPadding + head.y * cellSize + cellSize / 2;

                ctx.fillStyle = 'white';
                ctx.beginPath();
                
                // Draw triangle indicator pointing in movement direction
                let arrowSize = cellSize * 0.2;
                if (snake.dir.label === 'up') {
                    ctx.moveTo(hx, hy - arrowSize);
                    ctx.lineTo(hx - arrowSize, hy + arrowSize/2);
                    ctx.lineTo(hx + arrowSize, hy + arrowSize/2);
                } else if (snake.dir.label === 'down') {
                    ctx.moveTo(hx, hy + arrowSize);
                    ctx.lineTo(hx - arrowSize, hy - arrowSize/2);
                    ctx.lineTo(hx + arrowSize, hy - arrowSize/2);
                } else if (snake.dir.label === 'left') {
                    ctx.moveTo(hx - arrowSize, hy);
                    ctx.lineTo(hx + arrowSize/2, hy - arrowSize);
                    ctx.lineTo(hx + arrowSize/2, hy + arrowSize);
                } else if (snake.dir.label === 'right') {
                    ctx.moveTo(hx + arrowSize, hy);
                    ctx.lineTo(hx - arrowSize/2, hy - arrowSize);
                    ctx.lineTo(hx - arrowSize/2, hy + arrowSize);
                }
                ctx.closePath();
                ctx.fill();
            });
        }

        // Tapping event resolver
        function handleCanvasClick(e) {
            if (document.getElementById('win-overlay').classList.contains('active')) return;

            let rect = canvas.getBoundingClientRect();
            let clickX = e.clientX - rect.left;
            let clickY = e.clientY - rect.top;

            let cellSize = (canvas.width - boardPadding * 2) / currentLevel.width;

            let tileX = Math.floor((clickX - boardPadding) / cellSize);
            let tileY = Math.floor((clickY - boardPadding) / cellSize);

            // Find which snake is tapped
            let tappedSnake = gameState.snakes.find(s => {
                if (s.isEscaped) return false;
                return s.segments.some(seg => seg.x === tileX && seg.y === tileY);
            });

            if (tappedSnake) {
                tryMoveSnake(tappedSnake);
            }
        }

        function tryMoveSnake(snake) {
            let pathClear = checkPathClear(snake);

            if (pathClear) {
                // Record undo state
                gameState.undoStack.push(JSON.stringify(gameState.snakes));
                
                gameState.moves++;
                document.getElementById('hud-moves').innerText = gameState.moves;
                
                activeHintId = null; // Clear active hint indicator

                // Animate Slide off
                animateSnakeExit(snake);
            } else {
                // Blocked: play bump animation
                animateSnakeBump(snake);
            }
        }

        function checkPathClear(snake) {
            let head = snake.segments[0];
            let dx = snake.dir.x;
            let dy = snake.dir.y;
            
            let currX = head.x;
            let currY = head.y;

            while (true) {
                currX += dx;
                currY += dy;

                if (currX < 0 || currX >= currentLevel.width || currY < 0 || currY >= currentLevel.height) {
                    return true; // Successfully escaped boundary
                }

                // Check static obstacles
                if (currentLevel.obstacles.some(obs => obs.x === currX && obs.y === currY)) {
                    return false;
                }

                // Check other active snakes
                for (let os of gameState.snakes) {
                    if (os.id === snake.id || os.isEscaped) continue;
                    if (os.segments.some(seg => seg.x === currX && seg.y === currY)) {
                        return false;
                    }
                }
            }
        }

        // Animation Loops
        function animateSnakeExit(snake) {
            let elapsed = 0;
            let duration = 12; // frame count duration

            let dx = snake.dir.x;
            let dy = snake.dir.y;

            function step() {
                elapsed++;
                // Shift segments visually
                snake.segments.forEach(seg => {
                    seg.x += dx * 0.5;
                    seg.y += dy * 0.5;
                });

                drawBoard();

                if (elapsed < duration) {
                    animationFrameId = requestAnimationFrame(step);
                } else {
                    snake.isEscaped = true;
                    drawBoard();
                    checkLevelWin();
                }
            }
            animationFrameId = requestAnimationFrame(step);
        }

        function animateSnakeBump(snake) {
            let elapsed = 0;
            let forwardDuration = 4;
            let backDuration = 4;

            let dx = snake.dir.x;
            let dy = snake.dir.y;

            // Trigger physical haptic bump if supported
            if (navigator.vibrate) navigator.vibrate(20);

            function step() {
                elapsed++;
                let progress = 0;
                
                if (elapsed <= forwardDuration) {
                    // Push forward
                    snake.segments.forEach(seg => {
                        seg.x += dx * 0.05;
                        seg.y += dy * 0.05;
                    });
                } else {
                    // Retract
                    snake.segments.forEach(seg => {
                        seg.x -= dx * 0.05;
                        seg.y -= dy * 0.05;
                    });
                }

                drawBoard();

                if (elapsed < (forwardDuration + backDuration)) {
                    animationFrameId = requestAnimationFrame(step);
                } else {
                    // Reset to exact grid coordinate
                    gameState.snakes = gameState.snakes;
                    drawBoard();
                }
            }
            animationFrameId = requestAnimationFrame(step);
        }

        // Gameplay state checks
        function checkLevelWin() {
            let allCleared = gameState.snakes.every(s => s.isEscaped);
            if (allCleared) {
                // Show Win Overlay
                let winOverlay = document.getElementById('win-overlay');
                winOverlay.classList.add('active');

                // Compute stars
                let stars = 3;
                if (gameState.moves > currentLevel.silver) stars = 1;
                else if (gameState.moves > currentLevel.gold) stars = 2;

                document.getElementById('win-stars-display').innerText = '★'.repeat(stars) + '☆'.repeat(3 - stars);
                document.getElementById('win-moves-made').innerText = gameState.moves;
                document.getElementById('win-moves-optimal').innerText = currentLevel.gold;
                document.getElementById('win-stars-count').innerText = `${stars}/3`;

                // Save progression
                localStorage.setItem(`level_${currentLevel.id}_completed`, 'true');
                let bestStars = parseInt(localStorage.getItem(`level_${currentLevel.id}_stars`) || '0');
                if (stars > bestStars) {
                    localStorage.setItem(`level_${currentLevel.id}_stars`, stars);
                }
            }
        }

        // Controls button triggers
        function undoMove() {
            if (gameState.undoStack.length === 0) return;
            
            if (animationFrameId) cancelAnimationFrame(animationFrameId);

            let lastStateString = gameState.undoStack.pop();
            gameState.snakes = JSON.parse(lastStateString);
            
            gameState.moves--;
            document.getElementById('hud-moves').innerText = gameState.moves;
            activeHintId = null;

            drawBoard();
        }

        function restartLevel() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            startLevel(currentLevel);
        }

        function nextLevel() {
            if (currentLevel.id === 'Custom') {
                startLevel('procedural');
            } else {
                startCampaignLevel(currentLevel.id + 1);
            }
        }

        function showHint() {
            // Filter active unescaped snakes
            let activeSnakesList = gameState.snakes.filter(s => !s.isEscaped);
            
            let solver = new JSBacktrackingSolver(currentLevel);
            let solution = solver.Solve(activeSnakesList);

            if (solution && solution.length > 0) {
                activeHintId = solution[0]; // Pulse the first move snake
                drawBoard();
            } else {
                alert("This board state is currently stuck. Try restarting or undoing!");
            }
        }

        // Helper graphics functions
        function drawRoundRect(x, y, width, height, radius) {
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height - radius);
            ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
            ctx.lineTo(x + radius, y + height);
            ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }
    </script>
</body>
